format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$nodejs\
$bun\
$docker_context\
$time\
$cmd_duration\
$line_break\
$character\
"""

command_timeout = 3600000


palette = 'dracula'

# ───────────────────
# 🧛 Dracula Palette
# ───────────────────
[palettes.dracula]
color_fg0 = '#f8f8f2'
color_bg1 = '#282a36'
color_bg3 = '#44475a'
color_purple = '#bd93f9'
color_pink = '#ff79c6'
color_red = '#ff5555'
color_green = '#50fa7b'
color_yellow = '#f1fa8c'
color_blue = '#6272a4'
color_cyan = '#8be9fd'
color_orange = '#ffb86c'

# ───────────────────
# OS
# ───────────────────

[fill]
symbol = " "
[os]
disabled = false
style = "fg:color_purple"

[os.symbols]
Arch = "󰣇"
Linux = "󰌽"
Windows = "󰍲"
Macos = "󰀵"

# ───────────────────
# User
# ───────────────────
[username]
show_always = true
style_user = "fg:color_purple"
style_root = "fg:color_purple"
format = '[ $user  ]($style)'

# ───────────────────
# Directory
# ───────────────────

[directory]
format = "[$path](bold $style)[$read_only]($read_only_style) "
truncation_length = 2
style = "fg:blue"
read_only_style = "fg:blue"
before_repo_root_style = "fg:blue"
truncation_symbol = "…/"
truncate_to_repo = true
read_only = "  "

# ───────────────────
# Git
# ───────────────────

[git_branch]
format = "[ $branch]($style)"
style = "color_orange"
[git_status]
format = "[  ($conflicted$untracked$modified$staged$renamed$deleted)($ahead_behind$stashed)]($style)"
style = "fg:color_blue"

conflicted = "[✖${count}](fg:color_red) "
untracked = "[●${count}](fg:color_pink) "
modified = "[✚${count}](fg:color_yellow) "
staged = "[✔${count}](fg:color_green) "
renamed = "[➜${count}](fg:color_blue) "
deleted = "[✘${count}](fg:color_red) "

stashed = "[≡${count}](fg:color_cyan) "

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"
# ───────────────────
# Languages / Runtimes
# ───────────────────
[nodejs]
symbol = " "
format = '[[ $symbol($version) ](fg:color_green)]($style)'
detect_files = []
detect_extensions = []
[bun]
symbol = "🥟"
style = "fg:color_orange"
format = '[[ $symbol $version ]( fg:color_orange)]($style)'

[c]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol ](fg:color_fg0 bg:color_blue)]($style)'

[cpp]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol ](fg:color_fg0 bg:color_blue)]($style)'

[rust]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol $version ](fg:color_fg0 bg:color_blue)]($style)'

[golang]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol $version ](fg:color_fg0 bg:color_blue)]($style)'

[python]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol $version ](fg:color_fg0 bg:color_blue)]($style)'

# ───────────────────
# Docker
# ───────────────────
[docker_context]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol $context ](fg:color_cyan bg:color_bg3)]($style)'
detect_files = []
detect_extensions = []

# ───────────────────
# Time
# ───────────────────
[time]
disabled = false
time_format = "%R"
style = "fg:color_bg1"
format = '[[  $time ](fg:color_fg0)]($style)'

# ───────────────────
# Prompt
# ───────────────────
[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"
[cmd_duration]
format = "[$duration]($style) "
style = "yellow"
